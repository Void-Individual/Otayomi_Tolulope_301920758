<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1080"
  height="410"
  viewBox="0 0 1080 410"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Condensed business ER model</title>
  <desc id="desc">
    Each guest and room can have many reservations. Each category can have many
    rooms. Mandatory foreign keys connect each reservation to one guest and one
    room, and each room to one category. Selected fields are shown.
  </desc>
  <rect width="1080" height="410" fill="#ffffff" />
  <g font-family="Arial, sans-serif" fill="#162b42">
    <rect
      x="5"
      y="15"
      width="245"
      height="150"
      rx="10"
      fill="#edf3fa"
      stroke="#496883"
      stroke-width="2"
    />
    <text x="21" y="50" font-size="27" font-weight="700">Guest</text>
    <text x="21" y="90" font-size="23">guest_code (PK)</text>
    <text x="21" y="120" font-size="23">display_name</text>
    <rect
      x="330"
      y="120"
      width="330"
      height="270"
      rx="10"
      fill="#edf3fa"
      stroke="#496883"
      stroke-width="2"
    />
    <text x="346" y="155" font-size="27" font-weight="700">Reservation</text>
    <text x="346" y="195" font-size="23">reservation_ref (PK)</text>
    <text x="346" y="225" font-size="23">guest_code (FK)</text>
    <text x="346" y="255" font-size="23">room_number (FK)</text>
    <text x="346" y="285" font-size="23">arrival / departure</text>
    <text x="346" y="315" font-size="23">agreed_nightly_rate</text>
    <text x="346" y="345" font-size="23">status</text>
    <rect
      x="825"
      y="15"
      width="250"
      height="150"
      rx="10"
      fill="#edf3fa"
      stroke="#496883"
      stroke-width="2"
    />
    <text x="841" y="50" font-size="27" font-weight="700">Room category</text>
    <text x="841" y="90" font-size="23">category_code (PK)</text>
    <text x="841" y="120" font-size="23">category_name</text>
    <rect
      x="825"
      y="235"
      width="250"
      height="160"
      rx="10"
      fill="#edf3fa"
      stroke="#496883"
      stroke-width="2"
    />
    <text x="841" y="270" font-size="27" font-weight="700">Room</text>
    <text x="841" y="310" font-size="23">room_number (PK)</text>
    <text x="841" y="340" font-size="23">category_code (FK)</text>
    <text x="841" y="370" font-size="23">capacity</text>
    <g stroke="#496883" stroke-width="3" fill="none">
      <path d="M250 90 H290 V200 H330" />
      <path d="M950 165 V235" />
      <path d="M825 300 H660" />
    </g>
    <g font-size="24">
      <text x="258" y="77">1</text>
      <text x="290" y="224">0..*</text>
      <text x="963" y="186">1</text>
      <text x="963" y="224">0..*</text>
      <text x="797" y="287">1</text>
      <text x="674" y="287">0..*</text>
    </g>
  </g>
</svg>
